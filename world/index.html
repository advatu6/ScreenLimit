<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>איי לומה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-screen canvas world, floating HUD chips on top, bottom sheet for panels */
  --t:74,55,40; --night:#fbf6ec; --dusk:#cfe3c8; --glow:#f2c078; --coral:#e8846a; --mint:#8fc7a4; --ink:#4a3728; --accent:#b9603f;
  --panel:rgba(255,252,245,.96); --line:rgba(var(--t),.18);
  --display:"Amatic SC","Heebo","Arial Hebrew",sans-serif;
  --body:"Heebo","Arial Hebrew","Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;top:10px;inset-inline:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.zone h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0;text-shadow:0 1px 0 #fff,0 0 14px rgba(255,252,245,.95);letter-spacing:.5px}
.zone small{display:block;margin-top:4px;font-size:13px;opacity:.8;text-shadow:0 0 6px #fbf6ec,0 0 6px #fbf6ec,0 0 3px #fbf6ec}
.chip{box-shadow:0 2px 8px rgba(74,55,40,.1);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c9,var(--glow) 55%,#d99a3a);box-shadow:0 0 10px var(--glow)}
.side{position:absolute;inset-inline-end:12px;top:64px;display:flex;flex-direction:column;gap:8px}
.side button{box-shadow:0 2px 8px rgba(74,55,40,.1);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:500;min-width:72px}
.side button:hover{border-color:var(--accent)}
#sideItems{display:flex;flex-direction:column;gap:8px}
#bMenu[aria-expanded=true]{border-color:var(--accent)}
.side .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-inline-start:6px}
.bottom{position:absolute;bottom:0;inset-inline:0;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.bottom>*{pointer-events:auto;width:100%;max-width:560px}
.emotes{display:flex;gap:6px;justify-content:center}
.emotes button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
#chat{display:flex;gap:6px}
#chatInput{box-shadow:0 2px 8px rgba(74,55,40,.1);flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 16px}
#chatInput::placeholder{color:rgba(var(--t),.5)}
.primary{background:var(--glow);color:#2a1d05;font-weight:700;border-radius:999px;padding:10px 18px}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
#act{position:absolute;bottom:124px;left:50%;transform:translateX(-50%);box-shadow:0 6px 24px rgba(255,207,122,.35);white-space:nowrap}
#toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--glow);border-radius:12px;padding:9px 16px;font-weight:500;max-width:86%;text-align:center;pointer-events:none;transition:opacity .25s}
#toast.off{opacity:0}
.backdrop{position:absolute;inset:0;background:rgba(74,55,40,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:82%;display:flex;flex-direction:column}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px}}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px}
.sheet h2{font-family:var(--display);font-size:36px;line-height:1;margin:0;font-weight:700;text-wrap:balance}
.sheet .body{padding:6px 18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet p{margin:0;line-height:1.5}
.muted{opacity:.72;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{background:rgba(var(--t),.06);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.card.on{border-color:var(--accent);background:rgba(242,192,120,.25)}
.card canvas{width:84px;height:84px}
.card b{font-size:14px}
.card button{width:100%;font-size:13px;padding:6px 8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{background:rgba(var(--t),.08);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.maplist small{font-size:13px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.tabs button.on{background:var(--ink);color:var(--night);font-weight:700}
.quest{background:rgba(var(--t),.06);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.quest .bar{height:8px;border-radius:99px;background:rgba(var(--t),.12);overflow:hidden}
.quest .bar i{display:block;height:100%;background:var(--mint);border-radius:99px}
.quest .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.maplist{display:grid;gap:8px}
.maplist button{display:flex;justify-content:space-between;align-items:center;background:rgba(var(--t),.06);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:start}
.maplist button.on{border-color:var(--accent)}
.maplist i{width:14px;height:14px;border-radius:50%;display:inline-block}
#game{position:absolute;inset:0;background:var(--night);display:flex;flex-direction:column}
#game header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:10px}
#game h2{font-family:var(--display);font-size:34px;margin:0;line-height:1}
#gstage{flex:1;position:relative;min-height:0}
#gcanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#gboard{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;max-width:520px;margin:auto;align-content:center}
#gboard button{aspect-ratio:3/4;border-radius:14px;background:var(--dusk);border:2px solid var(--line);font-size:38px;line-height:1}
#gboard button.open{background:#fff}
#gboard button.done{background:rgba(143,199,164,.35);border-color:var(--mint)}
#gresult{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(251,246,236,.95);text-align:center;padding:20px}
#gresult h3{font-family:var(--display);font-size:36px;margin:0;line-height:1}
#gpanel{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px;max-width:520px;margin:auto}
#gpanel p{margin:0}
.wgrid{display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:repeat(5,46px);gap:6px}
.wt{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}
.wt.g{background:#7fb58f;border-color:#7fb58f;color:#fff}.wt.y{background:#e3a857;border-color:#e3a857;color:#fff}.wt.n{background:rgba(var(--t),.12)}
.kb{display:flex;flex-direction:column;gap:6px;direction:ltr;width:100%}
.kb div{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:44px;height:44px;border-radius:8px;background:rgba(var(--t),.16);font-size:18px;font-weight:500;padding:0}
.kb button.g{background:#7fb58f;color:#fff}.kb button.y{background:#e3a857;color:#fff}.kb button.n{background:rgba(var(--t),.05);opacity:.5}
.kb button.wide{max-width:110px;flex:2;font-size:15px}
textarea.field{min-height:84px;resize:vertical;line-height:1.45;font-family:inherit}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lbl>span{opacity:.85}
.sec{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(var(--t),.03)}
.sec h3{margin:0;font-size:17px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:rgba(var(--t),.06)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;inset-inline-start:4px;color:#fff;background:rgba(74,55,40,.8);border-radius:999px;width:26px;height:26px;padding:0;font-size:16px;line-height:1}
.addimg{position:relative;overflow:hidden;cursor:pointer;width:84px;height:84px;border-radius:12px;border:1px dashed rgba(var(--t),.4);display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;padding:6px;background:transparent}
.addimg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.addimg:focus-within{outline:2px solid var(--glow);outline-offset:2px}
.addimg.busy{opacity:.6;pointer-events:none}
.terms{max-height:220px;overflow-y:auto;background:rgba(var(--t),.06);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
.terms ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.prod{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:rgba(var(--t),.06);border:1px solid var(--line);border-radius:14px;padding:8px}
.prod img,.prod .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:rgba(var(--t),.08)}
.price{font-weight:700;color:var(--accent);white-space:nowrap}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;flex:none}
.gallery img{height:190px;border-radius:14px;scroll-snap-align:start;flex:none;max-width:90%;object-fit:cover}
.prow{display:grid;gap:8px;background:rgba(var(--t),.04);border:1px solid var(--line);border-radius:12px;padding:10px}
.prow .row{flex-wrap:nowrap}
.err{color:#b9442e;font-size:14px;margin:0}
a.primary{text-decoration:none;text-align:center;display:block}
.stallcard{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-align:start;background:rgba(var(--t),.06);border:1px solid var(--line);border-radius:14px;padding:10px}
.stallcard:hover{border-color:var(--accent)}
.stallcard img,.stallcard .ph{width:72px;height:72px;border-radius:12px;object-fit:cover}
.dmlist{display:flex;flex-direction:column;gap:6px;min-height:180px;max-height:44vh;overflow-y:auto;padding:4px 2px;flex:none}
.dm{max-width:82%;padding:8px 12px;border-radius:14px;overflow-wrap:anywhere;line-height:1.4}
.dm.me{background:var(--glow);align-self:flex-start}
.dm.them{background:rgba(var(--t),.1);align-self:flex-end}
.rule{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:rgba(var(--t),.05);border:1px solid var(--line);border-radius:14px;padding:10px 12px;line-height:1.45}
.rule .num{width:30px;height:30px;border-radius:50%;background:var(--glow);display:flex;align-items:center;justify-content:center;font-weight:700}
.legal summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--accent)}
.zone{min-width:0;flex:1 1 auto}
.hud>.row{flex:none}
@media(max-width:520px){.zone h1{font-size:32px}.hud .chip{padding:6px 10px;gap:5px}}
.gelt{width:16px;height:16px;border-radius:50%;background:#9cc4e8;border:2px solid #f2c078;flex:none;display:inline-block}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="world" aria-label="עולם המשחק"></canvas>

<div class="hud">
  <div class="zone"><h1 id="zoneName">כיכר הפנסים</h1><small id="evTag" hidden style="font-weight:600;opacity:1;white-space:nowrap"></small><small id="online" hidden></small></div>
  <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="chip" id="bSound" aria-label="צליל">♪</button><button class="chip" id="evChip" hidden><span class="gelt" id="evCoin"></span><span id="gelt">0</span></button><div class="chip" id="lvl">רמה 1</div><div class="chip" title="ניצוצות"><span class="coin"></span><span id="coins">0</span></div></div>
</div>

<div class="side">
  <button id="bMenu" aria-expanded="false" aria-controls="sideItems">תפריט<span class="dot" id="mDot" hidden></span></button>
  <div id="sideItems" hidden>
  <button id="bMap">מפה</button>
  <button id="bMe">הדמות</button>
  <button id="bQuests">משימות<span class="dot" id="qDot" hidden></span></button>
  <button id="bEvent" hidden><span id="evName">חג</span><span class="dot" id="eDot" hidden></span></button>
  <button id="bFriends">חברים והודעות<span class="dot" id="fDot" hidden></span></button>
  <button id="bAlbum">אוסף</button>
  <button id="bFurn" hidden>רהיטים</button>
  <button id="bAdmin" hidden>ניהול העולם<span class="dot" id="aDot" hidden></span></button>
  <button id="bTest" hidden>בדיקות</button>
  </div>
</div>

<button id="act" class="primary" hidden></button>
<div id="toast" class="off"></div>

<div class="bottom">
  <div class="emotes" id="emotes" hidden>
    <button data-em="wave">שלום</button>
    <button data-em="heart">לב</button>
    <button data-em="laugh">צחוק</button>
    <button data-em="jump">קפיצה</button>
  </div>
  <form id="chat" autocomplete="off">
    <button type="button" class="ghost" id="bEm" aria-label="תגובות" aria-expanded="false" style="padding:8px 12px">☺</button>
    <input id="chatInput" maxlength="60" placeholder="לכתוב משהו…" aria-label="הודעה" enterkeyhint="send">
    <button class="primary" type="submit">שליחה</button>
  </form>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle"></h2><button class="ghost" id="sheetClose">סגירה</button></header>
    <div class="body" id="sheetBody"></div>
  </div>
</div>

<div id="game" hidden>
  <header>
    <h2 id="gTitle"></h2>
    <div class="row"><span class="chip" id="gInfo"></span><button class="ghost" id="gClose">יציאה</button></div>
  </header>
  <div id="gstage">
    <canvas id="gcanvas"></canvas>
    <div id="gboard" hidden></div>
    <div id="gpanel" hidden></div>
    <div id="gresult" hidden>
      <h3 id="gResTitle"></h3><p id="gResText"></p>
      <div class="row" style="justify-content:center"><button class="primary" id="gAgain">שוב</button><button class="ghost" id="gBack">חזרה לעולם</button></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function el(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){if(k==='class')e.className=props[k];else if(k==='text')e.textContent=props[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),props[k]);else if(k==='style')e.style.cssText=props[k];else if(k.startsWith('aria-'))e.setAttribute(k,props[k]);else e[k]=props[k];}
  for(const k of kids)if(k)e.append(k);return e;}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`;}
function mix(h,t,k){const a=hexRgb(h),b=hexRgb(t);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('');}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h);};

/* ---------- data ---------- */
const ZW=1400,ZH=820,CX=700,CY=480,RX=620,RY=300;
const COLORS=['#ff8f70','#ffc857','#7be0c3','#6fb7ff','#b79bff','#ff8fc7','#9be36b','#f4efff'];
const HATS={none:{n:'בלי כובע',p:0},leaf:{n:'עלה',p:15},flower:{n:'פרח',p:25},cap:{n:'כובע מצחייה',p:30},wizard:{n:'כובע קוסם',p:40},bow:{n:'פפיון',p:20},bunny:{n:'אוזני ארנב',p:45},headphones:{n:'אוזניות',p:60},pirate:{n:'כובע פיראט',p:70},crown:{n:'כתר',p:120},halo:{n:'הילה זוהרת',rare:1},tophat:{n:'צילינדר זהב',rare:1},horns:{n:'קרני דרקון',rare:1},flame:{n:'כתר להבות',rare:1},galaxy:{n:'כוכבים חגים',rare:1},rainbow:{n:'קשת אישית',rare:1},butterflies:{n:'להקת פרפרים',rare:1},storm:{n:'ענן סערה',rare:1}};
const FURN={plant:{n:'עציץ',p:20},lamp:{n:'מנורה',p:30},rug:{n:'שטיח',p:35,flat:1},table:{n:'שולחן',p:40},sofa:{n:'ספה',p:50},bed:{n:'מיטה',p:70},shelf:{n:'ספרייה',p:60},aquarium:{n:'אקווריום',p:90},neon:{n:'שלט ניאון',p:55},vinyl:{n:'פטיפון',p:65},espresso:{n:'מכונת אספרסו',p:75},throne:{n:'כס מלכות',rare:1},moonlamp:{n:'מנורת ירח',rare:1},starportal:{n:'שער כוכבים',rare:1},disco:{n:'כדור דיסקו',rare:1},aurora:{n:'מקרן זוהר צפוני',rare:1},sparkf:{n:'מזרקת ניצוצות',rare:1},jelly:{n:'אקווריום מדוזות',rare:1}};
const PETS={puff:{n:'ענני',p:80},fox:{n:'שועלון',p:100},star:{n:'כוכבון',p:130},dragon:{n:'דרקונצ׳יק',rare:1},ghost:{n:'רוחון',rare:1},phoenix:{n:'עוף חול',rare:1},ufo:{n:'עב״ם קטן',rare:1}};
const WHEEL=[{t:'10 ניצוצות',w:26,c:'#6fb7ff',coins:10},{t:'פריט נדיר',w:7,c:'#f4efff',kind:'rare'},{t:'25 ניצוצות',w:22,c:'#7be0c3',coins:25},{t:'רהיט מהחנות',w:12,c:'#b79bff',kind:'furn'},{t:'50 ניצוצות',w:14,c:'#ffc857',coins:50},{t:'קופה של 300',w:3,c:'#ff5d8f',coins:300},{t:'כובע מהחנות',w:9,c:'#ff8fc7',kind:'hat'},{t:'100 ניצוצות',w:7,c:'#ff8f70',coins:100}];

/* ---------- isometric helpers: the ground axes run along (1,.5) and (-1,.5) ---------- */
function isoBox(x,y,w,d,h,top,left,right){

  return{F,R,L,B,h};}
/* a patch on a vertical face from ground point p to ground point q, u along the ground, v up (0..1 of h) */

const C={priv:null,pub:null,ready:false,keys:{}};
const SOC={inbox:[],reports:[],bans:{},startAt:Date.now()};
let DMV=null;
const b64=u=>{let s='';for(const c of u)s+=String.fromCharCode(c);return btoa(s);},ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const idOk=id=>typeof id==='string'&&/^[A-Za-z0-9_.:@+~-]{1,90}$/.test(id);
const friends=()=>{if(!S.friends||typeof S.friends!=='object')S.friends={};return S.friends;};
const blocks=()=>{if(!S.blocks||typeof S.blocks!=='object')S.blocks={};return S.blocks;};
const dms=()=>{if(!S.dm||typeof S.dm!=='object')S.dm={};return S.dm;};
const isBanned=id=>!!id&&!!SOC.bans[id];
const isBlocked=p=>muted.has(p.id)||(!!p.uid&&(!!blocks()[p.uid]||isBanned(p.uid)));
const peerOf=id=>{for(const p of peers.values())if(p.uid===id)return p;return null;};
function maskBad(t){for(const b of BAD_LONG)t=t.replace(new RegExp(b,'gi'),'***');return t.split(/(\s+)/).map(tok=>{const core=tok.replace(/^[^a-zA-Zא-ת]+|[^a-zA-Zא-ת]+$/g,'').toLowerCase();return core&&(BAD_TOK.includes(core)||BAD_TOK.includes(core.replace(/^[וה]/,'')))?'***':tok;}).join('');}
const cleanDM=t=>maskBad(str(String(t),300).trim());
function bannedMe(){if(isBanned(M.uid)){toast('החשבון שלך הושעה על ידי מנהל/ת העולם, ואי אפשר לשלוח הודעות.');return true;}return false;}

/* keys: a private key only this account can read, a public key everyone can */
async function cryptoInit(){try{if(!M.db||!M.uid||!window.crypto||!crypto.subtle)return;const alg={name:'ECDH',namedCurve:'P-256'},ref=M.db.doc('data/users/'+M.uid+'/crypto');
  const sn=await ref.get();let jw=sn.exists?JSON.parse(JSON.stringify(sn.data())):null;
  if(!jw||!jw.priv||!jw.pub){const kp=await crypto.subtle.generateKey(alg,true,['deriveKey']);jw={priv:await crypto.subtle.exportKey('jwk',kp.privateKey),pub:await crypto.subtle.exportKey('jwk',kp.publicKey)};await ref.set(jw);}
  C.priv=await crypto.subtle.importKey('jwk',jw.priv,alg,false,['deriveKey']);C.pub=jw.pub;
  const kd=M.db.doc('keys/'+M.uid),ks=await kd.get();if(!ks.exists||JSON.stringify((ks.data()||{}).pub)!==JSON.stringify(jw.pub))await kd.set({pub:jw.pub});
  C.ready=true;}catch(e){}}
async function sharedKey(id){if(C.keys[id])return C.keys[id];try{const s=await M.db.doc('keys/'+id).get();if(!s.exists)return null;const pub=await crypto.subtle.importKey('jwk',JSON.parse(JSON.stringify(s.data().pub)),{name:'ECDH',namedCurve:'P-256'},false,[]);
  return C.keys[id]=await crypto.subtle.deriveKey({name:'ECDH',public:pub},C.priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}catch(e){return null;}}
async function encMsg(key,text){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));return{t:Date.now(),iv:b64(iv),c:b64(new Uint8Array(ct))};}
async function decList(key,arr){const out=[];for(const m of(Array.isArray(arr)?arr:[]).slice(-50)){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv)},key,ub64(m.c));out.push({t:Number(m.t)||0,x:new TextDecoder().decode(pt)});}catch(e){}}return out;}

async function socialInit(){try{if(!M.db)return;
  M.db.doc('mod/bans').onSnapshot(s=>{const d=s.exists?s.data():null;SOC.bans=d&&d.ids&&typeof d.ids==='object'?JSON.parse(JSON.stringify(d.ids)):{};socialChanged();},()=>{});
  if(!M.uid)return;await cryptoInit();
  M.db.collection('dmidx').where('to','==',M.uid).onSnapshot(s=>{const prev=new Map(SOC.inbox.map(i=>[i.from,i.at]));
    SOC.inbox=s.docs.filter(d=>d.exists).map(d=>d.data()).filter(d=>d&&idOk(d.from)&&d.to===M.uid&&d.from!==M.uid).map(d=>({from:d.from,at:Number(d.at)||0,n:cleanName(d.n)}));
    for(const i of SOC.inbox)if(i.at>SOC.startAt&&i.at>(prev.get(i.from)||0)&&unread(i.from)&&!(DMV&&DMV.id===i.from)){toast('הודעה פרטית חדשה מ'+dmName(i.from)+'.');beep(700,.08);beep(1050,.12);break;}
    socialChanged();},()=>{});
  if(M.owner)M.db.collection('reports').onSnapshot(s=>{SOC.reports=[];for(const d of s.docs){if(!d.exists)continue;const l=(d.data()||{}).list;if(Array.isArray(l))for(const r of l)SOC.reports.push(Object.assign(JSON.parse(JSON.stringify(r)),{by:d.id}));}SOC.reports.sort((a,b)=>(b.at||0)-(a.at||0));socialChanged();},()=>{});
  socialChanged();}catch(e){}}
const openReports=()=>SOC.reports.filter(r=>!r.done);
const inboxOf=id=>SOC.inbox.find(i=>i.from===id);
const unread=id=>{const i=inboxOf(id);return!!i&&!blocks()[id]&&!isBanned(id)&&i.at>((dms()[id]||{}).read||0);};

/* ---------- holiday games on the beach ---------- */
const EVG_CAP=30;
function openEvGame(){if(!EV.on)return;GAMES.ev=E().game.n;openGame('ev');}
function evGameInit(){const g=E().game;G.mode=g.mode;G.flash='';G.flashT=0;$('gInfo').textContent='';g.init(G);}
function evGameTap(x,y){const g=EV.on&&E().game;if(!g||!G||G.over)return;if(g.tap)g.tap(G,x,y);else G.bx=x;}
function evGameFrame(dt,now,w,h){if(!EV.on){closeGame();return;}const c=E(),g=c.game;ctx=gx;const bg=gx.createLinearGradient(0,0,0,h);bg.addColorStop(0,c.sky[0]);bg.addColorStop(1,c.sky[2]);gx.fillStyle=bg;gx.fillRect(0,0,w,h);
  g.frame(G,dt,now,w,h);gx.textAlign='center';gx.textBaseline='alphabetic';
  if(G.flashT>0){G.flashT-=dt;gx.font='700 24px Heebo, sans-serif';gx.fillStyle='#4a3728';gx.fillText(G.flash,w/2,58);}
  gx.font='500 14px Heebo, sans-serif';gx.fillStyle='rgba(74,55,40,.85)';gx.fillText(g.hint,w/2,h-18);ctx=mainCtx;
  $('gInfo').textContent='נקודות: '+G.score+' · זמן: '+Math.max(0,Math.ceil(G.t));
  if(G.t<=0){evFinish(Math.floor(G.score/g.rate),g.end(G));return;}requestAnimationFrame(gameLoop);}
function evFinish(coins,text){if(!G||G.over)return;G.over=true;const e=ev(),c=E();if(e.gameDay!==today()){e.gameDay=today();e.gameCoins=0;}const give=Math.max(0,Math.min(coins,EVG_CAP-(e.gameCoins||0)));e.gameCoins=(e.gameCoins||0)+give;evGain(give);e.games=(e.games||0)+1;persist();refreshHud();beep(660,.1);beep(880,.1);beep(1320,.2);
  $('gResTitle').textContent='+'+give+' '+c.coin;$('gResText').textContent=text+(give<coins?' הגעת לתקרה היומית: עד '+EVG_CAP+' '+c.coin+' ביום ממשחק החג.':'');$('gresult').hidden=false;}
function drawEvGame(o){const c=E(),c1=c.booth[0];ell(o.x,o.y+6,44,16,'rgba(0,0,0,.2)');isoBox(o.x,o.y,24,20,34,mix(c1,'#ffffff',.4),c1,mix(c1,'#5a3e2b',.2));glow(o.x,o.y-62,60,'#ffc24a',.7);
  ctx.save();ctx.translate(o.x,o.y-40-Math.abs(Math.sin(T*2))*6);ctx.scale(2.2,2.2);c.drop.draw(0,0,{p:0,i:1});ctx.restore();label(o.x,o.y-112,'משחק החג: '+c.game.n,rgba(c1,.97),'#3a2a1c');}

function catchGame(n,hint,skin){return{n,mode:'catch',rate:2,hint,end:G=>'צברת '+G.score+' נקודות.',init(G){G.bx=G.w/2;G.items=[];G.spawn=0;},
  frame(G,dt,now,w,h){G.bx=clamp(G.bx+(G.right-G.left)*420*dt,40,w-40);G.spawn-=dt;if(G.spawn<0){G.spawn=rand(.3,.6);G.items.push({x:rand(24,w-24),y:-20,vy:rand(170,300),bad:Math.random()<.22,i:Math.floor(Math.random()*4)});}
    for(const it of G.items){it.y+=it.vy*dt;if(!it.hit&&it.y>h-100&&it.y<h-50&&Math.abs(it.x-G.bx)<52){it.hit=true;if(it.bad){G.score=Math.max(0,G.score-2);beep(160,.15,'sawtooth');G.flash=skin.ouch;G.flashT=.7;}else{G.score++;beep(900,.06);}}if(it.hit)continue;if(it.bad)skin.bad(it.x,it.y);else skin.good(it.x,it.y,it.i);}
    G.items=G.items.filter(it=>!it.hit&&it.y<h+30);skin.basket(G.bx,h-60);}};}
function aimGame(n,hint,skin){return{n,mode:'aim',rate:2,hint,end:G=>'צברת '+G.score+' נקודות ב-'+G.shots+' ניסיונות.',init(G){G.m=0;G.dir=1;G.sp=1.1;G.cool=0;G.shots=0;if(skin.init)skin.init(G);},
  frame(G,dt,now,w,h){G.m+=G.dir*G.sp*dt;if(G.m>1){G.m=1;G.dir=-1;}if(G.m<0){G.m=0;G.dir=1;}G.cool-=dt;skin.draw(G,w,h,now);
    const bw=Math.min(w-40,440),bx=(w-bw)/2,by=h-78;rr(bx,by,bw,26,13,'#fffaf0');rr(bx+bw*.22,by,bw*.56,26,13,'#f6ead9');rr(bx+bw*.34,by,bw*.32,26,13,'#c6e0a8');rr(bx+bw*.44,by,bw*.12,26,10,'#8fc7a4');rr(bx+G.m*bw-4,by-8,8,42,4,'#e8846a');},
  tap(G){if(G.cool>0)return;G.cool=.45;const d=Math.abs(G.m-.5),pts=d<.06?3:d<.16?2:d<.28?1:0;G.score+=pts;G.shots++;G.flash=skin.words[pts];G.flashT=.7;G.sp=Math.min(2.3,G.sp+.06);beep(pts?500+pts*180:170,.1,pts?'sine':'sawtooth');if(skin.hit)skin.hit(G,pts);}};}

EVENTS.purim.game=catchGame('משלוח מנות מעופף','תופסים אוזני המן וסוכריות בסל, ונזהרים מהפלפל החריף.',{ouch:'חריף!',

EVENTS.lagbaomer.game=aimGame('חץ וקשת','נוגעים במסך כשהסמן באמצע הירוק.',{words:['החטאה','כמעט','פגיעה יפה','בול!'],init:G=>{G.arrows=[];},
  hit:(G,pts)=>{const off=(G.m-.5)*2;G.arrows.push({dx:off*74,dy:rand(-8,8)*(4-pts)});if(G.arrows.length>7)G.arrows.shift();},
  draw:(G,w,h)=>{const cx=w/2,cy=h*.36;rr(cx-5,cy+60,10,h*.2,3,'#b89472');for(const[r,c]of[[78,'#fffaf0'],[60,'#f0a08c'],[42,'#fffaf0'],[24,'#f0a08c'],[9,'#e8665a']])circ(cx,cy,r,c);
    for(const a of G.arrows){const ax=cx+a.dx,ay=cy+a.dy;strokeLine([ax,ay,ax+16,ay+30],3,'#9a7352');poly([ax+16,ay+30,ax+10,ay+38,ax+22,ay+38],'#f0a08c');circ(ax,ay,2.6,'#5a3e2b');}
    const by=h-150;strokeArc(cx,by+26,54,26,Math.PI,0,5,'#9a7352');strokeLine([cx-54,by+26,cx,by+26+(G.cool>0?0:14),cx+54,by+26],1.4,'#7a5a44');strokeLine([cx,by+34,cx,by-10],3,'#b89472');poly([cx,by-18,cx-5,by-8,cx+5,by-8],'#c9cfd6');}});
EVENTS.sukkot.game=aimGame('בונים סוכה','נוגעים במסך כשהסמן באמצע הירוק, והפטיש מכה במסמר.',{words:['פספוס','מכה קלה','מכה טובה','מכה מושלמת!'],init:G=>{G.depth=0;G.nails=0;},
  hit:(G,pts)=>{G.depth+=pts*9;if(G.depth>=36){G.depth=0;G.nails++;G.score+=2;G.flash='מסמר בפנים! +2';G.flashT=.8;}},
  draw:(G,w,h)=>{const cx=w/2,by=h*.5;rr(20,by-150,w-40,26,6,'#9cc79c');for(let i=0;i<9;i++)strokeLine([30+i*(w-60)/8,by-146,36+i*(w-60)/8,by-128],2,'#7fae84');stringDecor(30,by-122,w-30,by-122,26,['#f2d95c','#f29bb4','#bfe3ea','#f0a08c'],false);
    rr(30,by,w-60,34,6,'#c9a57e');rr(w*.22,by-124,14,124,3,'#b89472');rr(w*.78-14,by-124,14,124,3,'#b89472');
    for(let i=0;i<Math.min(G.nails,8);i++)circ(cx-90+i*14+(i>3?70:0),by+17,4,'#c9cfd6');
    rr(cx-3,by-40+G.depth,6,40-G.depth,1.5,'#c9cfd6');rr(cx-9,by-46+G.depth,18,7,3,'#a9a3bd');
    const sw=G.cool>.2?0:1;ctx.save();ctx.translate(cx+70,by-70+G.depth*.5);ctx.rotate(sw?-.9:-.15);rr(-70,-6,74,10,4,'#b89472');rr(-86,-18,26,34,5,'#a9a3bd');ctx.restore();}});

EVENTS.hanukkah.game={n:'שומרים על האור',mode:'tap',rate:2,hint:'הרוח מכבה את הנרות. נוגעים בנר כבוי כדי להדליק אותו שוב.',end:G=>'הדלקת מחדש '+G.score+' נרות.',
  init(G){G.lit=Array(8).fill(true);G.blow=1;G.wind=0;},
  frame(G,dt,now,w,h){const s=Math.min(w/250,(h-190)/200),bx=w/2,by=h-90;G.geo={s,bx,by};G.blow-=dt;G.wind-=dt;
    if(G.blow<0){const on=[];G.lit.forEach((v,i)=>{if(v)on.push(i);});if(on.length){G.lit[on[Math.floor(Math.random()*on.length)]]=false;G.wind=.5;}G.blow=Math.max(.32,.95-(30-G.t)*.022);}
    if(G.wind>0)for(let i=0;i<4;i++)strokeLine([w*(.1+i*.2)+(.5-G.wind)*200,h*.22+i*26,w*(.1+i*.2)+70+(.5-G.wind)*200,h*.22+i*26],2,'rgba(120,150,190,'+(G.wind*1.2)+')');
    ell(bx,by+8,70*s,18*s,'rgba(0,0,0,.2)');drawMenorah(bx,by,s,G.lit);},
  tap(G,x,y){if(!G.geo)return;const{s,bx,by}=G.geo;let best=-1,bd=40;for(let j=0;j<8;j++){if(G.lit[j])continue;const cx=bx+(j<4?(4-j):-(j-3))*24*s,cy=by-140*s,d=Math.hypot(cx-x,(cy-y)*.6);if(d<bd){bd=d;best=j;}}if(best>=0){G.lit[best]=true;G.score++;beep(880,.07);beep(1175,.09);}}};
EVENTS.atzmaut.game={n:'מופע זיקוקים',mode:'tap',rate:2,hint:'נוגעים בזיקוק לפני שהוא בורח מהמסך.',end:G=>'הפעלת '+G.score+' זיקוקים.',
  init(G){G.rk=[];G.fx=[];G.spawn=.2;},
  frame(G,dt,now,w,h){G.spawn-=dt;if(G.spawn<0){G.spawn=rand(.32,.6);G.rk.push({x:rand(36,w-36),y:h+10,vy:rand(150,250),p:Math.random()*6,c:['#f29bb4','#f2d95c','#9cc4e8','#fffaf0','#a8d8c4'][Math.floor(Math.random()*5)]});}
    for(const r of G.rk){r.y-=r.vy*dt;const rx=r.x+Math.sin(now/260+r.p)*10;r.sx=rx;glow(rx,r.y+22,22,'#ffc24a',1);poly([rx-4,r.y+14,rx,r.y+28+Math.sin(now/50)*4,rx+4,r.y+14],'#ffb347');rr(rx-6,r.y-10,12,26,4,r.c);poly([rx-7,r.y-10,rx,r.y-24,rx+7,r.y-10],'#e8846a');}
    G.rk=G.rk.filter(r=>r.y>-30&&!r.dead);
    for(const f of G.fx){f.t+=dt*1.5;for(let i=0;i<12;i++){const a=i*.5236,r0=8+f.t*40,r1=14+f.t*78;strokeLine([f.x+Math.cos(a)*r0,f.y+Math.sin(a)*r0,f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1],3,rgba(f.c==='#fffaf0'?'#f2c078':f.c,Math.max(0,1-f.t)));}}G.fx=G.fx.filter(f=>f.t<1);},
  tap(G,x,y){let best=null,bd=46;for(const r of G.rk){const d=Math.hypot((r.sx||r.x)-x,r.y-y);if(d<bd){bd=d;best=r;}}if(best){best.dead=true;G.fx.push({x:best.sx||best.x,y:best.y,t:0,c:best.c});G.score++;beep(1100,.05);beep(700,.12,'triangle');}}};
EVENTS.tubishvat.game={n:'משקים את השתילים',mode:'tap',rate:2,hint:'נוגעים בשתיל צמא כדי להשקות אותו לפני שהוא נובל.',end:G=>'השקית '+G.score+' שתילים.',
  init(G){G.cells=Array(9).fill(null);G.spawn=.4;},
  frame(G,dt,now,w,h){const cs=Math.min((w-40)/3,(h-210)/3,120),x0=(w-cs*3)/2,y0=70;G.geo={cs,x0,y0};G.spawn-=dt;
    if(G.spawn<0){const free=[];G.cells.forEach((c,i)=>{if(!c)free.push(i);});if(free.length)G.cells[free[Math.floor(Math.random()*free.length)]]={t:0,wet:false};G.spawn=Math.max(.3,.75-(30-G.t)*.012);}
    for(let i=0;i<9;i++){const cx=x0+(i%3+.5)*cs,cy=y0+(Math.floor(i/3)+.72)*cs,c=G.cells[i];ell(cx,cy,cs*.36,cs*.13,'#b89472');ell(cx,cy-3,cs*.28,cs*.09,'#9a7352');if(!c)continue;c.t+=dt;
      if(c.wet){const k=Math.min(1,c.t/.3);rr(cx-2,cy-36*k,4,36*k,2,'#7fae84');ell(cx-10,cy-22*k,10,5,'#a8cfa6');ell(cx+10,cy-28*k,10,5,'#9cc79c');for(let q=0;q<5;q++)circ(cx+Math.cos(q*1.257)*6*k,cy-40*k+Math.sin(q*1.257)*6*k,4.4*k,'#f6a8c0');circ(cx,cy-40*k,3*k,'#f2c078');if(c.t>.7)G.cells[i]=null;}
      else{const droop=Math.min(1,c.t/1.7);strokeLine([cx,cy-2,cx+6*droop,cy-22+8*droop],3,'#a9b98a');ell(cx+6*droop-7,cy-22+10*droop,7,4,'#c9cf9a');ell(cx+6*droop+7,cy-24+12*droop,7,4,'#c9cf9a');
        const py=cy-50+Math.sin(now/160)*3;poly([cx-6,py+3,cx,py-10,cx+6,py+3,cx,py+9],'#7fc2d2');if(c.t>1.7)G.cells[i]=null;}}},
  tap(G,x,y){if(!G.geo)return;const{cs,x0,y0}=G.geo,cx=Math.floor((x-x0)/cs),cy=Math.floor((y-y0)/cs);if(cx<0||cx>2||cy<0||cy>2)return;const c=G.cells[cy*3+cx];if(c&&!c.wet){c.wet=true;c.t=0;G.score++;beep(660,.06);beep(990,.08);}}};
EVENTS.pesach.game={n:'מחפשים את האפיקומן',mode:'find',rate:1,hint:'האפיקומן מסתתר מתחת לאחת הכריות. כל ניחוש אומר אם חם או קר.',end:()=>'',
  init(G){const pn=$('gpanel'),g=G,tx=Math.floor(Math.random()*5),ty=Math.floor(Math.random()*5);let clicks=0;const msg=el('p',{style:'text-align:center;font-weight:600;min-height:1.5em',text:'איפה האפיקומן?'});
    const grid=el('div',{style:'display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(100%,340px);direction:ltr'});
    for(let i=0;i<25;i++){const bx=i%5,by=Math.floor(i/5),bt=el('button',{style:'aspect-ratio:1;border-radius:12px;background:#f6ead9;border:2px solid var(--line);font-size:13px;font-weight:600;padding:0',onclick:()=>{if(G!==g||g.over||bt.disabled)return;clicks++;$('gInfo').textContent='ניחושים: '+clicks;const d=Math.abs(bx-tx)+Math.abs(by-ty);bt.disabled=true;
        if(!d){bt.style.background='#e8c9a0';bt.style.borderColor='#b9603f';bt.textContent='מצה!';evFinish(Math.max(3,14-clicks),'מצאת את האפיקומן ב-'+clicks+' ניחושים. פחות ניחושים שווים יותר.');return;}
        const[t,c]=d===1?['רותח','#f0a08c']:d===2?['חם','#f6cdb4']:d<=4?['פושר','#fbf1d6']:['קר','#bfe3ea'];bt.style.background=c;bt.textContent=t;msg.textContent=t+'…';beep(d<=2?700:300,.06);}});bt.setAttribute('aria-label','כרית');grid.append(bt);}
    pn.append(el('p',{style:'text-align:center;margin-top:4vh',text:this.hint}),grid,msg);$('gInfo').textContent='ניחושים: 0';}};
